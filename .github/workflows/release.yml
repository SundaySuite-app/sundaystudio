# Build and publish SundayStudio installers for macOS + Windows on a version
# tag. Produces a DRAFT GitHub Release with the bundled installers attached;
# review the draft, then publish.
#
# Cut a release:   npm version <patch|minor|major>   (bumps package.json)
#                  # bump src-tauri/tauri.conf.json "version" to match
#                  git tag vX.Y.Z && git push origin vX.Y.Z
#
# TEST builds for now: UNSIGNED (no Apple notarization / Windows cert) and no
# auto-updater manifest. Code signing + notarization + the updater plugin are
# Phase 9.2 — add the documented secrets + wiring (see docs/DISTRIBUTION.md)
# and flip `includeUpdaterJson` on then. Unsigned apps warn on first launch:
# macOS → right-click ▸ Open; Windows → "More info" ▸ "Run anyway".

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon (arm64). Intel/universal is a
          # follow-up (needs a universal target + matching deps).
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      # `tagName` and `releaseName` key off `github.ref_name` as though it were
      # a version tag. On a `workflow_dispatch` from a BRANCH, `ref_name` is the
      # branch ("main"), and the run would happily create a release literally
      # tagged `main` — a junk release for somebody to wonder about later.
      # Dispatch on a TAG still works: that is the documented way to re-run a
      # release without re-tagging.
      # Ported from sundayrec/.github/workflows/release.yml.
      - name: Refuse to build a release from a non-tag ref
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          echo "::error::release.yml ran on ${{ github.ref_type }} '${{ github.ref_name }}'."
          echo "This workflow only makes sense on a version tag — every release field is"
          echo "derived from the tag name. Re-run it selecting a tag, or push a v* tag."
          exit 1

      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Pinned: a floating stable + `-D warnings` turns any newly-added clippy lint into a red main. Bump deliberately.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled ffmpeg sidecar
        run: npm run fetch-ffmpeg

      # ⚠️ A Windows step that COMPILES (cargo/tauri) must not use `shell: bash`.
      # Git-bash puts C:\Program Files\Git\usr\bin first on PATH, where MSYS's
      # own link.exe shadows the MSVC linker and every build script dies with
      # "linking with `link.exe` failed" — nothing about the error names bash.
      # tauri-action runs outside bash, so this applies to hand-written run
      # steps (proven the hard way in a throwaway probe, 2026-09-20).
      - name: Build and publish (unsigned test build)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SundayStudio ${{ github.ref_name }}"
          releaseBody: |
            Test build of SundayStudio — the church podcast & jingle studio.

            ⚠️ These installers are UNSIGNED (test release). On first launch:
            - macOS: right-click the app ▸ Open ▸ Open.
            - Windows: "More info" ▸ "Run anyway".

            Signed + notarized builds with auto-update land in a later release.
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}
